<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Pattern Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ══════════════════ HEADER ══════════════════ -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-title">Dark Pattern Detector</div>
        <div class="logo-sub" id="js-site-url">—</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="js-toggle-overlay" title="Toggle highlights">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="btn-icon" id="js-scan-btn" title="Scan now">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══════════════════ MAIN CONTENT ══════════════════ -->
  <main class="main">

    <!-- Scanning state -->
    <div id="js-state-scanning" class="state hidden">
      <div class="scanning-anim">
        <div class="scan-ring ring-1"></div>
        <div class="scan-ring ring-2"></div>
        <div class="scan-ring ring-3"></div>
        <div class="scan-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
      </div>
      <p class="scan-label">Analyzing page for dark patterns…</p>
      <p class="scan-sub" id="js-scan-step">Extracting DOM elements</p>
    </div>

    <!-- Error state -->
    <div id="js-state-error" class="state hidden">
      <div class="state-icon error-icon">⚠</div>
      <p class="state-title">Connection Error</p>
      <p class="state-desc" id="js-error-msg">Could not reach the backend.</p>
      <button class="btn-primary" id="js-retry-btn">Retry Scan</button>
    </div>

    <!-- Idle state (no scan yet) -->
    <div id="js-state-idle" class="state">
      <div class="state-icon idle-icon">🔍</div>
      <p class="state-title">Ready to Scan</p>
      <p class="state-desc">Click Scan to detect dark patterns on this page.</p>
      <button class="btn-primary" id="js-start-scan-btn">Scan This Page</button>
    </div>

    <!-- Results state -->
    <div id="js-state-results" class="state hidden">

      <!-- Trust Score Card -->
      <div class="score-card" id="js-score-card">
        <div class="score-gauge-wrap">
          <svg class="score-gauge" viewBox="0 0 120 70">
            <!-- Track -->
            <path d="M10 65 A50 50 0 0 1 110 65" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
            <!-- Fill (animated) -->
            <path id="js-gauge-fill" d="M10 65 A50 50 0 0 1 110 65" fill="none"
                  stroke="url(#gaugeGrad)" stroke-width="10" stroke-linecap="round"
                  stroke-dasharray="157" stroke-dashoffset="157" />
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#ef4444"/>
                <stop offset="50%"  stop-color="#f59e0b"/>
                <stop offset="100%" stop-color="#22c55e"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="score-center">
            <div class="score-num" id="js-score-num">—</div>
            <div class="score-grade" id="js-score-grade">—</div>
          </div>
        </div>
        <div class="score-label" id="js-score-label">Trust Score</div>
        <div class="score-meta">
          <span id="js-detection-count">0 issues</span>
          <span class="dot">·</span>
          <span id="js-scan-time">—</span>
        </div>
      </div>

      <!-- Category Breakdown -->
      <div class="section">
        <div class="section-title">Category Breakdown</div>
        <div class="categories" id="js-categories">
          <!-- Injected by popup.js -->
        </div>
      </div>

      <!-- Flagged Elements List -->
      <div class="section" id="js-detections-section">
        <div class="section-title">Flagged Elements</div>
        <div class="detections-list" id="js-detections-list">
          <!-- Injected by popup.js -->
        </div>
      </div>

      <!-- Model info footer -->
      <div class="model-info" id="js-model-info"></div>
    </div>

  </main>

  <!-- ══════════════════ FOOTER ══════════════════ -->
  <footer class="footer">
    <label class="toggle-row">
      <span class="toggle-label">Auto-scan on page load</span>
      <div class="toggle-wrap">
        <input type="checkbox" id="js-auto-scan" checked />
        <span class="toggle-slider"></span>
      </div>
    </label>
    <a class="footer-link" href="http://localhost:8000/docs" target="_blank">API Docs ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
